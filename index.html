<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yarok</title>
    <link rel="icon" href="avatar.jpg" type="image/jpeg">
    <link rel="preload" as="image" href="avatar.jpg" fetchpriority="high">
    <link rel="preload" as="audio" href="audio.mp3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Skranji:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
            background: #08090a;
            color: #fff;
            -webkit-user-select: none;
            user-select: none;
        }

        #rain-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .fog-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .fog-layer::before,
        .fog-layer::after {
            content: '';
            position: absolute;
            width: 220%;
            height: 220%;
            top: -60%;
            left: -60%;
            background: radial-gradient(ellipse 65% 55% at 50% 50%, rgba(20,20,22,0.95) 0%, transparent 75%);
            animation: fog-move 22s ease-in-out infinite alternate;
        }

        .fog-layer::after {
            animation-duration: 32s;
            animation-direction: alternate-reverse;
            background: radial-gradient(ellipse 55% 45% at 35% 65%, rgba(15,15,17,0.9) 0%, transparent 70%);
        }

        @keyframes fog-move {
            from { transform: translate(0, 0); }
            to { transform: translate(6%, 4%); }
        }

        #intro {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #08090a;
            transition: opacity 0.9s ease, visibility 0.9s ease;
        }

        #intro.hidden {
            opacity: 0;
            visibility: hidden;
        }

        #enter-btn {
            position: relative;
            font-family: 'Skranji', cursive, sans-serif;
            font-size: clamp(14px, 2.2vw, 18px);
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(220, 220, 225, 0.85);
            background: rgba(25, 25, 28, 0.4);
            border: 1px solid rgba(150, 150, 158, 0.6);
            padding: 15px 48px;
            border-radius: 6px;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(140, 140, 148, 0.4), inset 0 0 10px rgba(140, 140, 148, 0.2);
            transition: border-color 0.3s, color 0.3s, transform 0.2s, box-shadow 0.3s;
        }

        #enter-btn:hover {
            border-color: rgba(230, 230, 235, 0.9);
            color: #fff;
            box-shadow: 0 0 25px rgba(200, 200, 208, 0.8), inset 0 0 15px rgba(200, 200, 208, 0.4);
            transform: scale(1.04);
        }

        #enter-btn:active {
            transform: scale(0.97);
        }

        #main {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease 0.1s;
            padding: 20px;
        }

        #main.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #card-wrap {
            perspective: 1000px;
            animation: fade-up 0.9s cubic-bezier(.2, .8, .4, 1) both;
            animation-delay: 0.3s;
            will-change: transform;
            width: 100%;
            max-width: 340px;
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(28px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-inner {
            display: flex;
            flex-direction: column;
            width: 100%;
            padding: 0 22px 24px;
            overflow: hidden;
            background: rgba(10, 10, 11, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background-clip: padding-box;
            border: 1px solid rgba(150, 150, 158, 0.4);
            border-radius: 16px;
            box-shadow: 0 0 35px rgba(120, 120, 128, 0.25),
                        0 0 70px rgba(80, 80, 88, 0.15),
                        inset 0 0 25px rgba(100, 100, 108, 0.15);
            will-change: transform;
            transition: transform 0.1s linear, box-shadow 0.3s ease;
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        .fetch-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
            text-align: center;
        }

        .titlebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 -22px 20px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(150, 150, 158, 0.18);
            font-size: 11px;
            color: #8a8a92;
            letter-spacing: 0.04em;
        }

        .dots { display: flex; gap: 7px; }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            cursor: default;
        }

        .dot.r { background: rgba(255, 255, 255, 0.16); }
        .dot.y { background: rgba(255, 255, 255, 0.16); }
        .dot.g { background: rgba(255, 255, 255, 0.16); }

        .status-dot {
            position: absolute;
            right: -6px;
            bottom: -6px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #6b6b73;
            border: 4px solid #0d0d0e;
            transition: background 0.3s;
        }

        .avatar-column {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .avatar-wrap {
            width: 110px;
            height: 110px;
            border-radius: 14px;
            background: rgba(22, 22, 24, 0.8);
            border: 1px solid rgba(150, 150, 158, 0.35);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-column {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .user-host {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .user { color: #f2f2f5; }

        .line-sep {
            height: 1px;
            margin: 14px 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
        }

        .info-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .info-row {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13.5px;
        }

        .key {
            color: #f2f2f5;
            font-weight: bold;
            min-width: 58px;
            text-align: right;
            flex-shrink: 0;
        }

        .colon {
            color: #8a8a92;
            margin-right: 10px;
        }

        .val {
            color: #c8c8ce;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }

        .link-item {
            font-size: 13.5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-btn, .link-a {
            background: none;
            border: none;
            color: #c8c8ce;
            font-family: inherit;
            font-size: 13.5px;
            cursor: pointer;
            padding: 0;
            text-decoration: none;
            transition: color 0.2s;
        }

        .link-btn:hover, .link-a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        #toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(14px);
            background: rgba(12, 12, 13, 0.9);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(140, 140, 148, 0.6);
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Skranji', cursive, sans-serif;
            font-size: 13px;
            letter-spacing: 0.04em;
            padding: 9px 22px;
            border-radius: 100px;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            box-shadow: 0 0 15px rgba(120, 120, 128, 0.4);
            transition: opacity 0.28s, transform 0.28s;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 580px) {
            #card-wrap { max-width: 320px; }
        }
    </style>

    <style id="grief-css">
        html, body { background:#050607; }
        #rain-canvas { opacity:.55; filter:blur(.4px); }
        .fog-layer { filter:grayscale(1) brightness(.8); }
        .card-inner { border-color:rgba(120,125,140,.28)!important;
          box-shadow:0 0 40px rgba(0,0,0,.9), 0 0 90px rgba(60,70,95,.18), inset 0 0 30px rgba(0,0,0,.6)!important;
          animation:breathe 7s ease-in-out infinite; }
        @keyframes breathe { 0%,100%{filter:brightness(1) saturate(.8)} 50%{filter:brightness(.9) saturate(.7)} }
        .avatar-wrap img { filter:grayscale(1) contrast(1.1) brightness(.9); }
        .avatar-wrap { position:relative; }
        .avatar-wrap::after { content:''; position:absolute; inset:0;
          background:radial-gradient(circle at 50% 40%, transparent 30%, rgba(0,0,0,.75) 100%); }
        #enter-btn { color:rgba(190,195,205,.7); animation:pulse 4.5s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:.45} 50%{opacity:.95} }

        #dark { position:fixed; inset:0; z-index:20; pointer-events:none;
          background:radial-gradient(circle 460px at var(--x,50%) var(--y,50%),
            rgba(0,0,0,0) 0%, rgba(0,0,0,.12) 50%, rgba(0,0,0,.72) 100%); }
        #vignette { position:fixed; inset:0; z-index:25; pointer-events:none;
          box-shadow:inset 0 0 110px 5px #000;
          background:radial-gradient(ellipse 55% 50% at 50% 50%, rgba(70,10,15,.28), transparent 70%); }
        html.night #vignette { background:none; box-shadow:inset 0 0 120px 10px #000; }
        html.night #vignette::before { content:''; position:absolute; inset:0;
          background:
            radial-gradient(ellipse 26% 24% at 50% 50%, rgba(90,8,14,.26), transparent 100%),
            radial-gradient(ellipse 48% 42% at 50% 50%, rgba(60,6,11,.2), transparent 100%);
          filter:blur(34px);
          opacity:var(--b,1);
          transition:opacity var(--bt,.9s) ease-out;
          animation:bloodrift 26s ease-in-out infinite alternate; }
        @keyframes bloodrift { from{transform:translate(-2%,-1.5%)} to{transform:translate(2.5%,2%)} }
        html.night #dark { background:radial-gradient(circle 380px at var(--x,50%) var(--y,50%), rgba(0,0,0,0) 0%, rgba(0,0,0,.2) 50%, rgba(0,0,0,.75) 100%); }
        html.night #rain-canvas { opacity:.7; }
        #grain { position:fixed; inset:0; width:100%; height:100%; z-index:30; pointer-events:none; opacity:.14; mix-blend-mode:overlay; }

        .flicker { animation:flick .5s steps(2,end) 1; }
        @keyframes flick { 0%{opacity:1} 20%{opacity:.15} 40%{opacity:.9} 55%{opacity:.05} 100%{opacity:1} }

        #lightning { position:fixed; inset:0; z-index:26; pointer-events:none; opacity:0;
          background:radial-gradient(ellipse at var(--lx,50%) 0%, rgba(235,242,255,.95) 0%, rgba(190,205,235,.55) 55%, rgba(150,165,200,.35) 100%); }
        #lightning.strike { animation:strike .9s linear 1; }
        @keyframes strike { 0%{opacity:0} 4%{opacity:.85} 10%{opacity:.15} 16%{opacity:1} 24%{opacity:.3} 40%{opacity:.12} 100%{opacity:0} }
        @media (max-width:600px) {
          #dark, html.night #dark { background:radial-gradient(circle 420px at var(--x,50%) var(--y,50%), rgba(0,0,0,0) 0%, rgba(0,0,0,.08) 55%, rgba(0,0,0,.5) 100%); }
          #vignette, html.night #vignette { box-shadow:inset 0 0 50px 0 #000; }
        }
        @media (max-height:560px) {
          #main { justify-content:flex-start; overflow-y:auto; }
          #card-wrap { margin:auto 0; }
        }
    </style>
</head>
<body>

    <canvas id="rain-canvas"></canvas>
    <div class="fog-layer"></div>

    <div id="intro">
        <button id="enter-btn">ENTER</button>
    </div>

    <div id="main">
        <div id="card-wrap">
            <div class="card-inner" id="cardInner">
                <div class="titlebar">
                    <span>yarok ~</span>
                    <div class="dots">
                        <span class="dot y"></span>
                        <span class="dot g"></span>
                        <span class="dot r"></span>
                    </div>
                </div>
                <div class="fetch-container">
                    <div class="avatar-column">
                        <div class="avatar-wrap">
                            <img src="avatar.jpg" alt="yarok" fetchpriority="high" decoding="async" onerror="this.style.display='none'">
                        </div>
                        <span class="status-dot" id="status-dot"></span>
                    </div>

                    <div class="info-column">
                        <div class="user-host">
                            <span class="user">yarok</span>
                        </div>

                        <div class="line-sep"></div>

                        <div class="info-group">
                            <div class="info-row">
                                <span class="key">OS</span>
                                <span class="colon">:</span>
                                <span class="val">Windows 11 Pro / CachyOS</span>
                            </div>
                        </div>

                        <div class="line-sep"></div>

                        <div class="links-group">
                            <div class="link-item">
                                <button class="link-btn" onclick="copyDiscord()">discord: pyosek</button>
                            </div>
                            <div class="link-item">
                                <a href="https://github.com/pyosek" target="_blank" rel="noopener" class="link-a">github: pyosek</a>
                            </div>
                            <div class="link-item">
                                <a href="https://steamcommunity.com/id/pyosek" target="_blank" rel="noopener" class="link-a">steam: pyosek</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast">Copied to clipboard!</div>

    <audio id="bg-audio" src="audio.mp3" preload="auto" loop></audio>

    <script>
        const canvas = document.getElementById('rain-canvas');
        const ctx = canvas.getContext('2d');
        let drops = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drops = [];
            const n = Math.floor((canvas.width * canvas.height) / 4500);
            for (let i = 0; i < n; i++) {
                drops.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    len: 12 + Math.random() * 25,
                    spd: 8 + Math.random() * 8,
                    op: 0.12 + Math.random() * 0.22,
                    w: 1 + Math.random() * 0.8
                });
            }
        }

        function drawRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const d of drops) {
                ctx.beginPath();
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x - d.len * 0.14, d.y + d.len);
                ctx.strokeStyle = `rgba(170,170,178,${d.op})`;
                ctx.lineWidth = d.w;
                ctx.stroke();
                d.y += d.spd;
                d.x -= d.spd * 0.14;
                if (d.y > canvas.height) { d.y = -d.len; d.x = Math.random() * canvas.width; }
            }
        }

        function loop() { drawRain(); requestAnimationFrame(loop); }

        window.addEventListener('resize', () => {
            isMob = window.innerWidth <= 600;
            resizeCanvas();
        });
        resizeCanvas();
        loop();

        const cardInner = document.getElementById('cardInner');
        let isMob = window.innerWidth <= 600;

        function tilt(e) {
            if (isMob || window.dooming) return;
            const r = cardInner.getBoundingClientRect();
            const cx = r.left + r.width / 2;
            const cy = r.top + r.height / 2;
            const dx = Math.max(-1, Math.min(1, (e.clientX - cx) / (r.width / 2)));
            const dy = Math.max(-1, Math.min(1, (e.clientY - cy) / (r.height / 2)));
            cardInner.style.transform = `rotateX(${-dy * 8}deg) rotateY(${dx * 8}deg) translateZ(0)`;
        }

        function resetTilt() {
            cardInner.style.transform = 'rotateX(0) rotateY(0) translateZ(0)';
        }

        document.addEventListener('mousemove', tilt);
        document.addEventListener('mouseleave', resetTilt);

        function copyDiscord() {
            navigator.clipboard.writeText('pyosek').catch(() => {
                const t = document.createElement('textarea');
                t.value = 'pyosek';
                document.body.appendChild(t);
                t.select();
                document.execCommand('copy');
                t.remove();
            });
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2200);
        }

        const audio = document.getElementById('bg-audio');
        const TARGET_VOLUME = 0.55;
        let hasEntered = false;
        let audioFadeInterval;

        document.getElementById('enter-btn').addEventListener('click', function() {
            if (hasEntered) return;
            hasEntered = true;
            audio.volume = 0;
            audio.play().then(() => {
                let v = 0;
                const fadeIn = setInterval(() => {
                    v = Math.min(v + 0.015, TARGET_VOLUME);
                    audio.volume = v;
                    if (v >= TARGET_VOLUME) clearInterval(fadeIn);
                }, 80);
            }).catch(() => {});

            setTimeout(() => {
                document.getElementById('intro').classList.add('hidden');
                document.getElementById('main').classList.add('visible');
            }, 140);
        });

        window.addEventListener("blur", () => {
            if (!hasEntered || window.dooming) return;
            clearInterval(audioFadeInterval);
            let currentVol = audio.volume;
            let step = currentVol / 60;
            audioFadeInterval = setInterval(() => {
                currentVol -= step;
                if (currentVol <= 0) {
                    currentVol = 0;
                    audio.volume = currentVol;
                    audio.pause();
                    clearInterval(audioFadeInterval);
                } else {
                    audio.volume = currentVol;
                }
            }, 50);
        });

        window.addEventListener("focus", () => {
            if (!hasEntered || window.dooming) return;
            clearInterval(audioFadeInterval);
            audio.play().catch(() => {});
            let currentVol = audio.volume;
            let step = (TARGET_VOLUME - currentVol) / 30;
            audioFadeInterval = setInterval(() => {
                currentVol += step;
                if (currentVol >= TARGET_VOLUME) {
                    currentVol = TARGET_VOLUME;
                    audio.volume = currentVol;
                    clearInterval(audioFadeInterval);
                } else {
                    audio.volume = currentVol;
                }
            }, 30);
        });
    </script>

    <div id="dark"></div>
    <div id="vignette"></div>
    <div id="lightning"></div>
    <canvas id="grain"></canvas>
    <script id="grief-js">
    (function(){
      const $ = s => document.querySelector(s);
      const R = (a,b) => a + Math.random()*(b-a);
      const night = true;
      document.documentElement.classList.add('night');
      const dark = $('#dark');
      const touch = matchMedia('(pointer:coarse)').matches;

      let tx = innerWidth/2, ty = innerHeight/2, cx = tx, cy = ty;
      addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
      addEventListener('touchmove', e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; }, {passive:true});
      let t0 = 0;
      (function loop(t){
        if (touch && t - t0 > 0) { tx = innerWidth/2 + Math.sin(t/2300)*innerWidth*.08; ty = innerHeight/2 + Math.cos(t/3100)*innerHeight*.05; }
        cx += (tx-cx)*.06; cy += (ty-cy)*.06;
        const f = 1 + Math.sin(t/180)*.015 + (Math.random()<.01 ? -.08 : 0);
        dark.style.setProperty('--x', cx+'px'); dark.style.setProperty('--y', cy+'px');
        dark.style.opacity = f;
        requestAnimationFrame(loop);
      })(0);

      const g = $('#grain'), gx = g.getContext('2d');
      function sizeGrain(){ g.width = Math.ceil(innerWidth/3); g.height = Math.ceil(innerHeight/3); }
      sizeGrain(); addEventListener('resize', sizeGrain);
      setInterval(() => {
        const im = gx.createImageData(g.width, g.height), d = im.data;
        for (let i=0;i<d.length;i+=4){ const v = Math.random()*255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
        gx.putImageData(im,0,0);
      }, 90);

      const card = $('#cardInner');
      setInterval(() => { if (Math.random()<.35){ card.classList.remove('flicker'); void card.offsetWidth; card.classList.add('flicker'); } }, 6000);

      const bolt = $('#lightning');
      function strike(){
        bolt.style.setProperty('--lx', R(15,85)+'%');
        bolt.classList.remove('strike'); void bolt.offsetWidth; bolt.classList.add('strike');
        setTimeout(strike, night ? R(9000,24000) : R(14000,38000));
      }
      setTimeout(strike, night ? 5000 : 8000);

      const vig = $('#vignette');
      function setBlood(v, t){
        vig.style.setProperty('--bt', t+'s');
        vig.style.setProperty('--b', v);
      }
      function bloodFlicker(){
        const n = 2 + Math.floor(Math.random()*3);
        let i = 0;
        (function step(){
          if (i >= n){ setBlood(1, .6); return; }
          setBlood(i % 2 === 0 ? R(.05,.25) : R(.6,1.2), .04);
          i++;
          setTimeout(step, R(50,140));
        })();
        setTimeout(bloodFlicker, R(8000,15000));
      }
      if (night) setTimeout(bloodFlicker, R(5000,9000));
    })();
    </script>
</body>
</html>
